name: Release to Oracle Cloud ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer version without v prefix (e.g., 1.0.0)
        required: true
        type: string
      source_sha:
        description: Exact 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate-and-gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prep.outputs.version }}
      sha: ${{ steps.prep.outputs.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Resolve Release Inputs
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.release_version }}"
            sha="${{ inputs.source_sha }}"
          else
            version="${GITHUB_REF_NAME#v}"
            sha="${GITHUB_SHA}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  certified-gates:
    needs: validate-and-gate
    uses: ./.github/workflows/certified-release-gates.yml
    with:
      source_sha: ${{ needs.validate-and-gate.outputs.sha }}

  build-and-push-images:
    needs: [validate-and-gate, certified-gates]
    runs-on: ubuntu-24.04
    outputs:
      api_digest: ${{ steps.manifest.outputs.api_digest }}
      web_digest: ${{ steps.manifest.outputs.web_digest }}
      postgis_digest: ${{ steps.manifest.outputs.postgis_digest }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-and-gate.outputs.sha }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ARM64/Multi-arch Images
        run: ./scripts/release/build-and-push "${{ needs.validate-and-gate.outputs.version }}" "${{ needs.validate-and-gate.outputs.sha }}"

      - name: Extract Immutable Manifest Digests
        id: manifest
        run: |
          source_tree=$(git rev-parse HEAD^{tree})
          ./scripts/release/verify-published "${{ needs.validate-and-gate.outputs.version }}" "${{ needs.validate-and-gate.outputs.sha }}" "$source_tree"
          api_digest=$(jq -r '.images[] | select(.component == "api") | .manifestDigest' release-manifest/release.json)
          web_digest=$(jq -r '.images[] | select(.component == "web") | .manifestDigest' release-manifest/release.json)
          postgis_digest=$(jq -r '.images[] | select(.component == "postgis") | .manifestDigest' release-manifest/release.json)
          
          echo "api_digest=${api_digest}" >> "$GITHUB_OUTPUT"
          echo "web_digest=${web_digest}" >> "$GITHUB_OUTPUT"
          echo "postgis_digest=${postgis_digest}" >> "$GITHUB_OUTPUT"

  deploy-oracle-arm64:
    needs: [validate-and-gate, build-and-push-images]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.validate-and-gate.outputs.sha }}

      - name: Deploy via SSH to OCI Instance
        env:
          SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.OCI_DEPLOY_DIR || '/opt/familyplaces' }}
          RELEASE_VERSION: ${{ needs.validate-and-gate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate-and-gate.outputs.sha }}
          API_DIGEST: ${{ needs.build-and-push-images.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.build-and-push-images.outputs.web_digest }}
          POSTGIS_DIGEST: ${{ needs.build-and-push-images.outputs.postgis_digest }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          echo "$SSH_KEY" | tr -d '\r' | ssh-add -
          
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          
          echo "==> Executing remote deployment on $SSH_HOST..."
          ssh "$SSH_USER@$SSH_HOST" "bash -s" <<EOF
            set -euo pipefail
            cd "$DEPLOY_DIR"
            
            # Sync workspace or pull repository changes
            git fetch --all --tags
            git checkout --detach "$RELEASE_SHA"
            
            # Update image digests and release tags in .env.production
            sed -i "s|^API_IMAGE=.*|API_IMAGE=ghcr.io/skiru/family-places-api@${API_DIGEST}|" .env.production
            sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=ghcr.io/skiru/family-places-web@${WEB_DIGEST}|" .env.production
            sed -i "s|^POSTGIS_IMAGE=.*|POSTGIS_IMAGE=ghcr.io/skiru/family-places-postgis@${POSTGIS_DIGEST}|" .env.production
            sed -i "s|^RELEASE_SHA=.*|RELEASE_SHA=${RELEASE_SHA}|" .env.production
            sed -i "s|^RELEASE_VERSION=.*|RELEASE_VERSION=${RELEASE_VERSION}|" .env.production
            
            # Execute deterministic deployment script
            ./scripts/deploy-oracle.sh
EOF
          
          echo "==> Remote deployment completed successfully."
