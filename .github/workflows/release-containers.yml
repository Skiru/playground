name: Release containers

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      publish_confirmation:
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  quality-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with: { fetch-depth: 0 }
      - run: ./scripts/check && ./scripts/test
      - run: pnpm --dir apps/web e2e:desktop && pnpm --dir apps/web e2e:mobile

  security-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with: { fetch-depth: 0 }
      - run: ./scripts/verify-gitleaks && ./scripts/check

  native-arm64-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with: { fetch-depth: 0 }
      - name: Assert native ARM host
        run: test "$(uname -m)" = aarch64 && test "$(docker info --format '{{.Architecture}}')" = aarch64
      - name: Build native runtime images
        run: docker build -f infra/docker/api.Dockerfile -t family-places-api:native . && docker build -f infra/docker/web.Dockerfile -t family-places-web:native . && docker build -f infra/docker/postgis.Dockerfile -t family-places-postgis:native .
      - name: Render and certify production topology
        run: ./scripts/production/test-native-arm64

  release-build-and-push:
    needs: [quality-x64, security-x64, native-arm64-runtime]
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_confirmation == 'PUBLISH'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with: { fetch-depth: 0 }
      - name: Validate immutable release request
        env: { VERSION: '${{ inputs.release_version }}', SOURCE: '${{ inputs.source_sha }}' }
        run: test "$SOURCE" = "$GITHUB_SHA" && printf '%s' "$SOURCE" | grep -Eq '^[0-9a-f]{40}$' && printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - run: ./scripts/release/build-and-push "${{ inputs.release_version }}" "${{ inputs.source_sha }}"

  release-manifest-and-attestation:
    needs: [release-build-and-push]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - run: ./scripts/release/verify-published "${{ inputs.release_version }}" "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: release-manifest, path: release-manifest }
