services:
  api:
    environment:
      APP_ENV: dev
      APP_DEBUG: 0
      APP_SECRET: deterministic-e2e-secret
      DATABASE_URL: postgresql://${POSTGRES_USER:-family_places}:${POSTGRES_PASSWORD:-replace-with-a-random-local-value}@database:5432/${POSTGRES_DB:-family_places}?serverVersion=18&charset=utf8
      LOCK_DSN: postgresql://${POSTGRES_USER:-family_places}:${POSTGRES_PASSWORD:-replace-with-a-random-local-value}@database:5432/${POSTGRES_DB:-family_places}?serverVersion=18&charset=utf8
      GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-}
      DEV_AUTH_ENABLED: "true"
      MEDIA_E2E_MODE: "true"
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:8080/media
    ports:
      - "127.0.0.1:8080:80"
    networks: [internal, edge]
    volumes:
      - media-data:/data/familyplaces-media
  worker:
    environment:
      APP_ENV: dev
      APP_DEBUG: 0
      APP_SECRET: deterministic-e2e-secret
      DATABASE_URL: postgresql://${POSTGRES_USER:-family_places}:${POSTGRES_PASSWORD:-replace-with-a-random-local-value}@database:5432/${POSTGRES_DB:-family_places}?serverVersion=18&charset=utf8
      LOCK_DSN: postgresql://${POSTGRES_USER:-family_places}:${POSTGRES_PASSWORD:-replace-with-a-random-local-value}@database:5432/${POSTGRES_DB:-family_places}?serverVersion=18&charset=utf8
      MEDIA_E2E_MODE: "true"
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:8080/media
    volumes:
      - media-data:/data/familyplaces-media
  fixtures:
    profiles: [fixtures]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: development
    environment:
      APP_ENV: dev
      APP_DEBUG: 0
      APP_SECRET: deterministic-e2e-secret
      DATABASE_URL: postgresql://${POSTGRES_USER:-family_places}:${POSTGRES_PASSWORD:-replace-with-a-random-local-value}@database:5432/${POSTGRES_DB:-family_places}?serverVersion=18&charset=utf8
      LOCK_DSN: postgresql://${POSTGRES_USER:-family_places}:${POSTGRES_PASSWORD:-replace-with-a-random-local-value}@database:5432/${POSTGRES_DB:-family_places}?serverVersion=18&charset=utf8
      DEV_AUTH_ENABLED: "true"
    depends_on:
      database:
        condition: service_healthy
    networks: [internal]
    volumes:
      - media-data:/data/familyplaces-media
  web:
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api
      MAP_STYLE_URL: http://127.0.0.1:3000/fixtures/map-style.json
      MAP_ATTRIBUTION: FamilyPlaces deterministic CI map
      MAP_PROVIDER_NAME: FamilyPlaces CI fixture
      GOOGLE_IDENTITY_ENABLED: ${GOOGLE_IDENTITY_ENABLED:-false}
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      E2E: "true"
      APP_ENV: dev
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [internal, edge]
  database:
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_places}
      POSTGRES_USER: ${POSTGRES_USER:-family_places}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-random-local-value}
    volumes:
      - database-test-data:/var/lib/postgresql

volumes:
  database-test-data:
