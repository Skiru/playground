name: family-places

services:
  gateway:
    image: ${GATEWAY_IMAGE:-caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c}
    build: !reset null
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-playground.com.pl}
      ACME_EMAIL: ${ACME_EMAIL:-admin@playground.com.pl}
    mem_limit: 128m
    cpus: 0.15
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./infra/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge, internal]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  api:
    image: ${API_IMAGE:?API_IMAGE is required in production}
    build: !reset null
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in production}
      LOCK_DSN: ${LOCK_DSN:-${DATABASE_URL}}
      GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-https://playground.com.pl}
      TRUSTED_AUTH_ORIGINS: ${TRUSTED_AUTH_ORIGINS:-https://playground.com.pl,https://www.playground.com.pl}
      DEV_AUTH_ENABLED: "false"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/familyplaces-media}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL is required in production}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_KEY: ${STORAGE_S3_KEY:-}
      STORAGE_S3_SECRET: ${STORAGE_S3_SECRET:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
      STORAGE_S3_PUBLIC_URL: ${STORAGE_S3_PUBLIC_URL:-}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
    volumes:
      - media-data:/data/familyplaces-media
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  worker:
    image: ${API_IMAGE:?API_IMAGE is required in production}
    build: !reset null
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in production}
      LOCK_DSN: ${LOCK_DSN:-${DATABASE_URL}}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/familyplaces-media}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_KEY: ${STORAGE_S3_KEY:-}
      STORAGE_S3_SECRET: ${STORAGE_S3_SECRET:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
      STORAGE_S3_PUBLIC_URL: ${STORAGE_S3_PUBLIC_URL:-}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
    volumes:
      - media-data:/data/familyplaces-media
    healthcheck:
      disable: true
    networks: [internal]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  place-discovery-scheduler:
    profiles: [discovery]
    image: ${API_IMAGE:?API_IMAGE is required in production}
    build: !reset null
    command: ["php", "bin/console", "messenger:consume", "scheduler_place_discovery", "--time-limit=3600", "--memory-limit=128M"]
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in production}
      LOCK_DSN: ${LOCK_DSN:-${DATABASE_URL}}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      PLACE_DISCOVERY_ENABLED: ${PLACE_DISCOVERY_ENABLED:-false}
    healthcheck:
      disable: true
    networks: [internal, discovery-egress]

  place-discovery-worker:
    profiles: [discovery]
    image: ${API_IMAGE:?API_IMAGE is required in production}
    build: !reset null
    command: ["php", "bin/console", "messenger:consume", "place_discovery", "--time-limit=3600", "--memory-limit=256M", "--failure-limit=5"]
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in production}
      LOCK_DSN: ${LOCK_DSN:-${DATABASE_URL}}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      PLACE_DISCOVERY_ENABLED: ${PLACE_DISCOVERY_ENABLED:-false}
      PLACE_DISCOVERY_HELPER: ${PLACE_DISCOVERY_HELPER:-/opt/familyplaces/overture_helper.py}
    healthcheck:
      disable: true
    networks: [internal, discovery-egress]

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required in production}
    build: !reset null
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MAP_STYLE_URL: ${MAP_STYLE_URL:?MAP_STYLE_URL is required in production}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:?MAP_ATTRIBUTION is required in production}
      MAP_PROVIDER_NAME: ${MAP_PROVIDER_NAME:?MAP_PROVIDER_NAME is required in production}
      GOOGLE_IDENTITY_ENABLED: ${GOOGLE_IDENTITY_ENABLED:-false}
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      DEV_AUTH_ENABLED: false
      APP_ENV: prod
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  database:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE is required in production}
    build: !reset null
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in production}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [internal]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.0@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df}
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets: [cloudflare_tunnel_token]
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 128m
    cpus: 0.1
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [edge]
    logging: {driver: local, options: {max-size: 5m, max-file: "3"}}

  observability-logs:
    image: ${DOZZLE_IMAGE:-amir20/dozzle:v8.11.8@sha256:716a4f940b5406bd8f88d9be7e4f9b8089bcce868e4c7d0d02462bfef693e5db}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 24h
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data
      - ${DOZZLE_USERS_FILE:-/etc/familyplaces/dozzle-users.yml}:/data/users.yml:ro
    mem_limit: 128m
    cpus: 0.15
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-/etc/familyplaces/cloudflared-token}

volumes:
  database-data:
  media-data:
  caddy-data:
  caddy-config:
  dozzle-data:

networks:
  edge:
  discovery-egress:
  internal:
    internal: true
