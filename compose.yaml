name: family-places

services:
  gateway:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-playground.com.pl}
      ACME_EMAIL: ${ACME_EMAIL:-admin@playground.com.pl}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./infra/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, internal]

  api:
    image: ${API_IMAGE:-family-places-api:local}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: production
    environment:
      APP_ENV:
      APP_DEBUG:
      APP_SECRET:
      DATABASE_URL:
      GOOGLE_CLIENT_ID:
      DEV_AUTH_ENABLED:
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      PLACE_DISCOVERY_ENABLED: ${PLACE_DISCOVERY_ENABLED:-false}
      PLACE_DISCOVERY_HELPER: /opt/familyplaces/overture_helper.py
      SERVER_NAME: :80
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal, api-egress]
    volumes:
      - media-data:/data/familyplaces-media

  worker:
    image: ${API_IMAGE:-family-places-api:local}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: production
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    working_dir: /app
    environment:
      APP_ENV:
      APP_DEBUG:
      APP_SECRET:
      DATABASE_URL:
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [internal, api-egress]
    volumes:
      - media-data:/data/familyplaces-media

  place-discovery-scheduler:
    image: ${API_IMAGE:-family-places-api:local}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: production
    command: ["php", "bin/console", "messenger:consume", "scheduler_place_discovery", "--time-limit=3600", "--memory-limit=128M"]
    environment:
      APP_ENV:
      APP_DEBUG:
      APP_SECRET:
      DATABASE_URL:
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      PLACE_DISCOVERY_ENABLED: ${PLACE_DISCOVERY_ENABLED:-false}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [internal, discovery-egress]

  place-discovery-worker:
    image: ${API_IMAGE:-family-places-api:local}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: discovery
    command: ["php", "bin/console", "messenger:consume", "place_discovery", "--time-limit=3600", "--memory-limit=256M", "--failure-limit=5"]
    environment:
      APP_ENV:
      APP_DEBUG:
      APP_SECRET:
      DATABASE_URL:
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      PLACE_DISCOVERY_ENABLED: ${PLACE_DISCOVERY_ENABLED:-false}
      PLACE_DISCOVERY_HELPER: /opt/familyplaces/overture_helper.py
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [internal, discovery-egress]

  web:
    image: ${WEB_IMAGE:-family-places-web:local}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: production
    environment:
      NODE_ENV:
      API_BASE_URL: http://api
      MAP_STYLE_URL:
      MAP_ATTRIBUTION:
      MAP_PROVIDER_NAME:
      GOOGLE_IDENTITY_ENABLED:
      PUBLIC_GOOGLE_CLIENT_ID:
      DEV_AUTH_ENABLED:
      APP_ENV:
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  database:
    image: postgis/postgis:18-3.6@sha256:c893f6f2652d11e13f50f8623045b3523991b41d038b4d213dc040f42641f0d7
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - database-data:/var/lib/postgresql
    networks: [internal]

  redis:
    image: redis:8-bookworm
    profiles: [redis]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  cf-access-validator:
    image: ${CF_ACCESS_VALIDATOR_IMAGE:-family-places-cf-access-validator:local}
    build:
      context: .
      dockerfile: infra/docker/cf-access-validator.Dockerfile
    environment:
      CLOUDFLARE_ACCESS_ISSUER: ${CLOUDFLARE_ACCESS_ISSUER:-https://playground.cloudflareaccess.com}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      CLOUDFLARE_ACCESS_TEST_MODE: ${CLOUDFLARE_ACCESS_TEST_MODE:-false}
      CLOUDFLARE_ACCESS_TEST_PUBLIC_KEY: ${CLOUDFLARE_ACCESS_TEST_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [internal, api-egress]

  dozzle-socket-proxy:
    image: ${DOZZLE_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1@sha256:6c22b9545adc95258af9deffdde6c0ce0a0a70716771e5a4e02d24d1b6e0dda1}
    environment:
      CONTAINERS: 1
      EVENTS: 1
      LOGS: 1
      PING: 1
      VERSION: 1
      INFO: 1
      POST: 0
      PUT: 0
      DELETE: 0
      EXEC: 0
      BUILD: 0
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      VOLUMES: 0
      NETWORKS: 0
      PLUGINS: 0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:2375/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [observability-internal]

  observability-logs:
    image: ${DOZZLE_IMAGE:-amir20/dozzle:v8.11.8@sha256:d6b43130cdee36aab01a1a1fae7f83b2b8db63c1ee3b5ef61781cb947967bc9b}
    expose:
      - "8080"
    environment:
      DOCKER_HOST: tcp://dozzle-socket-proxy:2375
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: ${DOZZLE_AUTH_HEADER_USER:-Cf-Access-Authenticated-User-Email}
      DOZZLE_AUTH_HEADER_EMAIL: ${DOZZLE_AUTH_HEADER_EMAIL:-Cf-Access-Authenticated-User-Email}
      DOZZLE_AUTH_HEADER_NAME: ${DOZZLE_AUTH_HEADER_NAME:-Cf-Access-Authenticated-User-Email}
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_NO_SENSITIVE: "true"
    volumes:
      - dozzle-data:/data
    depends_on:
      dozzle-socket-proxy:
        condition: service_healthy
      cf-access-validator:
        condition: service_healthy
    networks: [internal, observability-internal]

volumes:
  database-data:
  pnpm-store:
  media-data:
  caddy-data:
  caddy-config:
  dozzle-data:

networks:
  edge:
  api-egress:
  discovery-egress:
  internal:
    internal: true
  observability-internal:
    internal: true
